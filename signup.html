<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account | SMK Gajah Berang Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        /* 毛玻璃卡片样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        /* 输入框聚焦微效果 */
        .input-focus {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(49, 46, 129, 0.1);
        }
        /* 悬停微动画 */
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(49, 46, 129, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/40 to-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Header / Navigation -->
    <nav class="glass-card sticky top-0 z-50 border-b border-indigo-100/50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <img src="logo.png" alt="SMK Gajah Berang Logo" class="h-11 w-auto object-contain bg-white rounded-xl p-1 shadow-sm border border-slate-100 group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/45?text=SMKGB'">
                <div>
                    <span class="font-black text-xl tracking-tight text-indigo-950 block leading-tight">SMK GAJAH BERANG</span>
                    <span class="text-[11px] text-indigo-600 font-bold tracking-wider uppercase">Safety & Discipline Portal</span>
                </div>
            </a>
            <a href="login.html" class="text-xs font-bold text-slate-600 hover:text-indigo-900 transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg">
            
            <!-- Glassmorphism Registration Card -->
            <div class="glass-card rounded-[2.5rem] p-8 md:p-10 shadow-2xl shadow-indigo-900/10 border border-white">
                
                <!-- Card Header -->
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-indigo-900 text-amber-300 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-indigo-900/30 mb-4">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Create Student Account</h1>
                    <p class="text-slate-500 text-xs mt-1.5">Register to access confidential reporting & analytics</p>
                </div>

                <!-- Registration Form -->
                <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
                    
                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fa-solid fa-address-card"></i>
                            </span>
                            <input type="text" id="fullname" placeholder="e.g. Tan Si Ying" required 
                                   class="input-focus w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-indigo-600 focus:bg-white">
                        </div>
                    </div>

                    <!-- Student ID & Form Class Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Student ID</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-xs">
                                    <i class="fa-solid fa-id-badge"></i>
                                </span>
                                <input type="text" id="studentId" placeholder="e.g. STU1001" required 
                                       class="input-focus w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Class / Form</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-xs">
                                    <i class="fa-solid fa-school"></i>
                                </span>
                                <input type="text" id="formClass" placeholder="e.g. Form 3" required 
                                       class="input-focus w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" id="email" placeholder="student@smkgb.edu.my" required 
                                   class="input-focus w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-indigo-600 focus:bg-white">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-xs">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" placeholder="••••••••" required 
                                   class="input-focus w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-indigo-600 focus:bg-white">
                        </div>
                    </div>

                    <!-- Terms Agreement -->
                    <div class="pt-2">
                        <label class="flex items-start text-xs text-slate-600 cursor-pointer">
                            <input type="checkbox" required class="mt-0.5 rounded border-slate-300 text-indigo-900 focus:ring-indigo-500 mr-2">
                            <span>I agree to provide truthful safety reports and adhere to the school's code of conduct.</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-950 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-900/20 hover-lift text-xs transition-all mt-4">
                        Complete Registration
                    </button>
                </form>

                <!-- Login Redirect Link -->
                <div class="mt-6 pt-6 border-t border-slate-200/60 text-center">
                    <p class="text-xs text-slate-500 font-medium">
                        Already registered an account? 
                        <a href="login.html" class="text-indigo-600 font-extrabold hover:underline ml-1">Sign In</a>
                    </p>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center space-y-2">
            <p class="font-bold text-slate-300">SMK Gajah Berang &bull; Safety & Discipline Board</p>
            <p>&copy; 2026 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        function handleSignup(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value;
            const studentId = document.getElementById('studentId').value;
            const formClass = document.getElementById('formClass').value;
            const email = document.getElementById('email').value;

            // 保存新注册的学生个人数据到 LocalStorage
            const newStudent = {
                fullname,
                studentId,
                formClass,
                email
            };

            localStorage.setItem('registeredStudent', JSON.stringify(newStudent));
            localStorage.setItem('currentUser', studentId);
            localStorage.setItem('userRole', 'student');

            alert('Account created successfully! Redirecting to login page...');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
