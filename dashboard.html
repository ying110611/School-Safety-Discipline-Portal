<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK Gajah Berang - Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="logo.png" alt="SMK Gajah Berang Logo" class="h-10 w-auto object-contain bg-white rounded p-0.5" onerror="this.src='https://via.placeholder.com/40?text=Logo'">
                <div>
                    <span class="font-bold text-lg tracking-wide block leading-tight">SMK GAJAH BERANG</span>
                    <span class="text-[10px] text-amber-300 font-medium tracking-wider uppercase">Safety & Discipline Portal</span>
                </div>
            </a>
            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-xs text-indigo-200 font-medium">Welcome, Student</span>
                <a href="index.html" onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3 py-1.5 rounded text-xs transition">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content: Student Dashboard -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        <div class="grid md:grid-cols-3 gap-8">
            
            <!-- Left Column: Submit Report Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Submit New Report
                </h2>

                <form onsubmit="submitReport(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-700">Incident Category</label>
                        <select id="category" required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select Category</option>
                            <option value="Bullying">Bullying (Physical / Verbal)</option>
                            <option value="Vandalism">Vandalism</option>
                            <option value="Cyberbullying">Cyberbullying</option>
                            <option value="Other">Other Violation</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-700">Location</label>
                        <input type="text" id="location" placeholder="e.g. Block B 2nd Floor Corridor" required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-700">Description Details</label>
                        <textarea id="description" rows="4" placeholder="Describe what happened clearly..." required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-lg text-sm shadow transition">
                        Submit Report
                    </button>
                </form>
            </div>

            <!-- Right Column: Report History Table -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> My Submitted Reports
                </h2>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase bg-slate-50">
                                <th class="p-3">ID</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Location</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="report-list" class="text-xs divide-y divide-slate-100">
                            <!-- Dynamically generated rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="font-semibold text-slate-300">SMK Gajah Berang - Discipline & Safety Board</p>
            <p>&copy; 2026 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // 初始化读取用户信息
        const currentUser = localStorage.getItem('currentUser') || 'Student';
        document.getElementById('user-display').innerText = `Welcome, ${currentUser}`;

        // 默认样本数据
        let reports = JSON.parse(localStorage.getItem('userReports')) || [
            { id: 'REP-101', category: 'Bullying', location: 'Canteen Area', date: '2026-08-01', status: 'Pending' },
            { id: 'REP-102', category: 'Vandalism', location: 'Toilet Block A', date: '2026-08-02', status: 'Under Investigation' }
        ];

        function renderReports() {
            const tbody = document.getElementById('report-list');
            tbody.innerHTML = '';

            if (reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No reports submitted yet.</td></tr>`;
                return;
            }

            reports.forEach(rep => {
                let badgeClass = 'bg-amber-100 text-amber-800';
                if (rep.status === 'Resolved') badgeClass = 'bg-emerald-100 text-emerald-800';
                if (rep.status === 'Under Investigation') badgeClass = 'bg-blue-100 text-blue-800';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-700">${rep.id}</td>
                    <td class="p-3">${rep.category}</td>
                    <td class="p-3">${rep.location}</td>
                    <td class="p-3 text-slate-400">${rep.date}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${badgeClass}">${rep.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function submitReport(e) {
            e.preventDefault();
            const category = document.getElementById('category').value;
            const location = document.getElementById('location').value;
            const newId = 'REP-' + Math.floor(100 + Math.random() * 900);
            const today = new Date().toISOString().split('T')[0];

            reports.unshift({
                id: newId,
                category: category,
                location: location,
                date: today,
                status: 'Pending'
            });

            localStorage.setItem('userReports', JSON.stringify(reports));
            renderReports();
            e.target.reset();
            alert('Report submitted successfully!');
        }

        function logout() {
            localStorage.removeItem('currentUser');
        }

        renderReports();
    </script>
</body>
</html>
